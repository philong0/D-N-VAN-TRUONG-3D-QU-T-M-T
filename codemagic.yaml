workflows:
  ios-scanner:
    name: Dr Van Truong 3D Scanner iOS App
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "ios/DrVanTruongScanner.xcodeproj"
        XCODE_SCHEME: "DrVanTruongScanner"
    scripts:
      - name: Inspect project schemes & SDKs
        script: |
          echo "=== List Schemes & Targets ==="
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "=== List SDKs ==="
          xcodebuild -showsdks
      - name: Build iOS Application Archive & Package IPA
        script: |
          mkdir -p build/ios/ipa build/DrVanTruongScanner.xcarchive
          echo "=== Running xcodebuild Archive ==="
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/DrVanTruongScanner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          echo "=== Packaging Application IPA ==="
          APP_PATH=$(find build/DrVanTruongScanner.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          if [ -d "$APP_PATH" ]; then
            mkdir -p build/Payload
            cp -r "$APP_PATH" build/Payload/
            cd build
            zip -r ios/ipa/DrVanTruongScanner.ipa Payload
            cd ..
            echo "Successfully generated build/ios/ipa/DrVanTruongScanner.ipa"
          else
            echo "Warning: .app bundle not found in archive, searching build directory"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/DrVanTruongScanner.xcarchive
      - build/**/*.app
      - /tmp/xcodebuild_logs/*.log
